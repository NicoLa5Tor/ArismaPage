# Local Postgres and MinIO for NorPress. Names come from back/.env so an installation that already has data keeps
# its database and volumes (NORPRESS_DB_NAME, NORPRESS_DB_USER, NORPRESS_DB_VOLUME, NORPRESS_MEDIA_VOLUME).
services:
  objectstore:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${NORPRESS_S3_ACCESS_KEY:?Set NORPRESS_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${NORPRESS_S3_SECRET_KEY:?Set NORPRESS_S3_SECRET_KEY}
    ports:
      - "127.0.0.1:19010:9000"
      - "127.0.0.1:19011:9001"
    volumes:
      - media:/data
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${NORPRESS_DB_NAME:-norpress}
      POSTGRES_USER: ${NORPRESS_DB_USER:-norpress}
      POSTGRES_PASSWORD: ${NORPRESS_DB_PASSWORD:?Set NORPRESS_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NORPRESS_DB_USER:-norpress} -d ${NORPRESS_DB_NAME:-norpress}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  data:
    name: ${NORPRESS_DB_VOLUME:-norpress_data}
  media:
    name: ${NORPRESS_MEDIA_VOLUME:-norpress_media}
