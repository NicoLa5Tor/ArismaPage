quarkus.application.name=arisma-back
quarkus.http.host=127.0.0.1
quarkus.http.port=${PORT:9001}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:arisma}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/arisma_quarkus}
quarkus.flyway.migrate-at-start=true
quarkus.datasource.devservices.enabled=false
quarkus.http.limits.max-body-size=6M
quarkus.jackson.accept-case-insensitive-enums=true
