quarkus.application.name=norpress-back
quarkus.http.host=127.0.0.1
quarkus.http.port=${PORT:9001}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:norpress}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5433/norpress}
quarkus.flyway.migrate-at-start=true
quarkus.datasource.devservices.enabled=false
quarkus.http.limits.max-body-size=6M
quarkus.jackson.accept-case-insensitive-enums=true

# Automatic tracking of carrier shipments (17TRACK). Without a key the panel switch stays unavailable.
# NORPRESS_TRACKING_PLAN: free (10 shipments a month) or plus (50 a month, paid).
norpress.tracking.key=${NORPRESS_TRACKING_KEY:}
norpress.tracking.plan=${NORPRESS_TRACKING_PLAN:free}
%test.quarkus.scheduler.enabled=false
# Cloudflare Turnstile on sign-in, sign-up and password reset. Both empty: no challenge (local development).
norpress.turnstile.site-key=${NORPRESS_TURNSTILE_SITE_KEY:}
norpress.turnstile.secret=${NORPRESS_TURNSTILE_SECRET:}
